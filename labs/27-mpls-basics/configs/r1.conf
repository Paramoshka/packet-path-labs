frr defaults traditional
hostname r1
log stdout
service integrated-vtysh-config
!
router ospf
 ospf router-id 1.1.1.1
 network 10.0.12.0/30 area 0
 network 1.1.1.1/32 area 0
!
mpls ldp
 router-id 1.1.1.1
 address-family ipv4
  discovery transport-address 1.1.1.1
  interface eth1
 exit-address-family
!
