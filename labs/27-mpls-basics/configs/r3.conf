frr defaults traditional
hostname r3
log stdout
service integrated-vtysh-config
!
router ospf
 ospf router-id 3.3.3.3
 network 10.0.23.0/30 area 0
 network 3.3.3.3/32 area 0
!
mpls ldp
 router-id 3.3.3.3
 address-family ipv4
  discovery transport-address 3.3.3.3
  interface eth1
 exit-address-family
!
