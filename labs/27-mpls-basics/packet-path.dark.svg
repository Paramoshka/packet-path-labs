<text x="24" y="30" font-size="12.5" font-weight="600" fill="#8b949e">27 · LDP label distribution and MPLS forwarding</text>
<text x="776" y="30" font-size="11" fill="#8b949e" text-anchor="end">&#8635; 19.9s loop</text>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0126;0.1583;0.1709;1" dur="19.9s" repeatCount="indefinite"/><text x="400.0" y="345" font-size="13" fill="#e6edf3" text-anchor="middle">OSPF area 0 converges and floods the loopback /32 routes — the IGP basis for LDP label binding.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0126;0.1583;0.1709;1" dur="19.9s" repeatCount="indefinite"/><text x="24" y="373" font-size="10" fill="#8b949e">step 1/4</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1709;0.1834;0.3995;0.4121;1" dur="19.9s" repeatCount="indefinite"/><text x="400.0" y="345" font-size="13" fill="#e6edf3" text-anchor="middle">LDP maps labels to /32 FECs (values illustrative); r3 advertises implicit-null for its own loopback.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1709;0.1834;0.3995;0.4121;1" dur="19.9s" repeatCount="indefinite"/><text x="24" y="373" font-size="10" fill="#8b949e">step 2/4</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4121;0.4246;0.6709;0.6834;1" dur="19.9s" repeatCount="indefinite"/><text x="400.0" y="345" font-size="13" fill="#e6edf3" text-anchor="middle">r1 pushes label 100 for FEC 3.3.3.3/32; r2 pops it (penultimate-hop popping) and forwards plain IPv4.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4121;0.4246;0.6709;0.6834;1" dur="19.9s" repeatCount="indefinite"/><text x="24" y="373" font-size="10" fill="#8b949e">step 3/4</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.6834;0.696;0.9874;1" dur="19.9s" repeatCount="indefinite"/><text x="400.0" y="345" font-size="13" fill="#e6edf3" text-anchor="middle">The reply is labeled symmetrically toward 1.1.1.1/32: r3 pushes, r2 pops, r1 receives plain IPv4.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.6834;0.696;0.9874;1" dur="19.9s" repeatCount="indefinite"/><text x="24" y="373" font-size="10" fill="#8b949e">step 4/4</text></g>
