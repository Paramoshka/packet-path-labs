frr defaults traditional
hostname customer
log stdout
!
route-map ALLOW-ALL permit 10
!
ip prefix-list OWN seq 5 permit 203.0.113.0/24
route-map OWN-ONLY permit 10
 match ip address prefix-list OWN
!
router bgp 65001
 bgp router-id 3.3.3.3
 neighbor 10.38.23.1 remote-as 65002
 neighbor 10.38.34.2 remote-as 65003
 address-family ipv4 unicast
  network 203.0.113.0/24
  neighbor 10.38.23.1 activate
  neighbor 10.38.23.1 route-map ALLOW-ALL in
  neighbor 10.38.23.1 route-map ALLOW-ALL out
  neighbor 10.38.34.2 activate
  neighbor 10.38.34.2 route-map ALLOW-ALL in
  neighbor 10.38.34.2 route-map OWN-ONLY out
 exit-address-family
!
