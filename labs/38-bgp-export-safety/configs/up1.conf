frr defaults traditional
hostname up1
log stdout
!
route-map ALLOW-ALL permit 10
!
router bgp 65002
 bgp router-id 2.2.2.2
 neighbor 10.38.12.1 remote-as 65004
 neighbor 10.38.23.2 remote-as 65001
 address-family ipv4 unicast
  neighbor 10.38.12.1 activate
  neighbor 10.38.12.1 route-map ALLOW-ALL in
  neighbor 10.38.12.1 route-map ALLOW-ALL out
  neighbor 10.38.23.2 activate
  neighbor 10.38.23.2 route-map ALLOW-ALL in
  neighbor 10.38.23.2 route-map ALLOW-ALL out
 exit-address-family
!
