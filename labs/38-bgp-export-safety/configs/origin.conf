frr defaults traditional
hostname origin
log stdout
!
route-map ALLOW-ALL permit 10
!
router bgp 65004
 bgp router-id 1.1.1.1
 neighbor 10.38.12.2 remote-as 65002
 address-family ipv4 unicast
  network 198.51.100.0/24
  neighbor 10.38.12.2 activate
  neighbor 10.38.12.2 route-map ALLOW-ALL in
  neighbor 10.38.12.2 route-map ALLOW-ALL out
 exit-address-family
!
