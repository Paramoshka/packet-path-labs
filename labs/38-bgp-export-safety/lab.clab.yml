name: pp38
topology:
  defaults:
    kind: linux
    image: ${FRR_IMAGE:=quay.io/frrouting/frr:10.7.1}
    sysctls:
      net.ipv4.ip_forward: 1
  nodes:
    origin:
      binds:
      - configs/daemons:/etc/frr/daemons:ro
      - configs/vtysh.conf:/etc/frr/vtysh.conf:ro
      - configs/origin.conf:/etc/frr/frr.conf:ro
      exec:
      - ip addr add 10.38.12.1/30 dev eth1
      - ip addr add 198.51.100.1/24 dev lo
    up1:
      binds:
      - configs/daemons:/etc/frr/daemons:ro
      - configs/vtysh.conf:/etc/frr/vtysh.conf:ro
      - configs/up1.conf:/etc/frr/frr.conf:ro
      exec:
      - ip addr add 10.38.12.2/30 dev eth1
      - ip addr add 10.38.23.1/30 dev eth2
    customer:
      binds:
      - configs/daemons:/etc/frr/daemons:ro
      - configs/vtysh.conf:/etc/frr/vtysh.conf:ro
      - configs/customer.conf:/etc/frr/frr.conf:ro
      exec:
      - ip addr add 10.38.23.2/30 dev eth1
      - ip addr add 10.38.34.1/30 dev eth2
      - ip addr add 203.0.113.1/24 dev lo
    up2:
      binds:
      - configs/daemons:/etc/frr/daemons:ro
      - configs/vtysh.conf:/etc/frr/vtysh.conf:ro
      - configs/up2.conf:/etc/frr/frr.conf:ro
      exec:
      - ip addr add 10.38.34.2/30 dev eth1
  links:
  - endpoints:
    - origin:eth1
    - up1:eth1
  - endpoints:
    - up1:eth2
    - customer:eth1
  - endpoints:
    - customer:eth2
    - up2:eth1
