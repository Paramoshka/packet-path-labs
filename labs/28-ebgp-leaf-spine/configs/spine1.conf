frr defaults traditional
hostname spine1
log stdout
service integrated-vtysh-config
!
router bgp 65000
 bgp router-id 1.1.1.1
 neighbor 10.0.11.2 remote-as 65101
 neighbor 10.0.12.2 remote-as 65102
 neighbor 10.0.13.2 remote-as 65103
 neighbor 10.0.14.2 remote-as 65104
 address-family ipv4 unicast
  neighbor 10.0.11.2 activate
  neighbor 10.0.12.2 activate
  neighbor 10.0.13.2 activate
  neighbor 10.0.14.2 activate
 exit-address-family
!
