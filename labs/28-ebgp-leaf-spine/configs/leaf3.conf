frr defaults traditional
hostname leaf3
log stdout
service integrated-vtysh-config
!
ip route 10.3.0.0/24 Null0
router bgp 65103
 bgp router-id 3.3.3.3
 neighbor 10.0.13.1 remote-as 65000
 neighbor 10.0.23.1 remote-as 65000
 address-family ipv4 unicast
  network 10.3.0.0/24
  neighbor 10.0.13.1 activate
  neighbor 10.0.23.1 activate
  maximum-paths 2
 exit-address-family
!
