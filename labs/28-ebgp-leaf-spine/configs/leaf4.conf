frr defaults traditional
hostname leaf4
log stdout
service integrated-vtysh-config
!
ip route 10.4.0.0/24 Null0
router bgp 65104
 bgp router-id 4.4.4.4
 neighbor 10.0.14.1 remote-as 65000
 neighbor 10.0.24.1 remote-as 65000
 address-family ipv4 unicast
  network 10.4.0.0/24
  neighbor 10.0.14.1 activate
  neighbor 10.0.24.1 activate
  maximum-paths 2
 exit-address-family
!
