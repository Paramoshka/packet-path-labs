frr defaults traditional
hostname leaf1
log stdout
service integrated-vtysh-config
!
ip route 10.1.0.0/24 Null0
router bgp 65101
 bgp router-id 1.1.1.1
 neighbor 10.0.11.1 remote-as 65000
 neighbor 10.0.21.1 remote-as 65000
 address-family ipv4 unicast
  network 10.1.0.0/24
  neighbor 10.0.11.1 activate
  neighbor 10.0.21.1 activate
  maximum-paths 2
 exit-address-family
!
