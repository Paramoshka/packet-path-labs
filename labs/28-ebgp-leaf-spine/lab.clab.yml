name: pp28

topology:
  defaults:
    kind: linux
    image: "${FRR_IMAGE:=quay.io/frrouting/frr:10.7.1}"
    sysctls: {net.ipv4.ip_forward: 1}
  nodes:
    spine1:
      binds: ["configs/daemons:/etc/frr/daemons:ro", "configs/spine1.conf:/etc/frr/frr.conf:ro"]
      exec: ["ip addr add 10.0.11.1/30 dev eth1", "ip addr add 10.0.12.1/30 dev eth2", "ip addr add 10.0.13.1/30 dev eth3", "ip addr add 10.0.14.1/30 dev eth4", "ip addr add 10.255.255.1/32 dev lo"]
    spine2:
      binds: ["configs/daemons:/etc/frr/daemons:ro", "configs/spine2.conf:/etc/frr/frr.conf:ro"]
      exec: ["ip addr add 10.0.21.1/30 dev eth1", "ip addr add 10.0.22.1/30 dev eth2", "ip addr add 10.0.23.1/30 dev eth3", "ip addr add 10.0.24.1/30 dev eth4", "ip addr add 10.255.255.2/32 dev lo"]
    leaf1:
      binds: ["configs/daemons:/etc/frr/daemons:ro", "configs/leaf1.conf:/etc/frr/frr.conf:ro"]
      exec: ["ip addr add 10.0.11.2/30 dev eth1", "ip addr add 10.0.21.2/30 dev eth2"]
    leaf2:
      binds: ["configs/daemons:/etc/frr/daemons:ro", "configs/leaf2.conf:/etc/frr/frr.conf:ro"]
      exec: ["ip addr add 10.0.12.2/30 dev eth1", "ip addr add 10.0.22.2/30 dev eth2"]
    leaf3:
      binds: ["configs/daemons:/etc/frr/daemons:ro", "configs/leaf3.conf:/etc/frr/frr.conf:ro"]
      exec: ["ip addr add 10.0.13.2/30 dev eth1", "ip addr add 10.0.23.2/30 dev eth2"]
    leaf4:
      binds: ["configs/daemons:/etc/frr/daemons:ro", "configs/leaf4.conf:/etc/frr/frr.conf:ro"]
      exec: ["ip addr add 10.0.14.2/30 dev eth1", "ip addr add 10.0.24.2/30 dev eth2"]
  links:
    - endpoints: ["spine1:eth1", "leaf1:eth1"]
    - endpoints: ["spine1:eth2", "leaf2:eth1"]
    - endpoints: ["spine1:eth3", "leaf3:eth1"]
    - endpoints: ["spine1:eth4", "leaf4:eth1"]
    - endpoints: ["spine2:eth1", "leaf1:eth2"]
    - endpoints: ["spine2:eth2", "leaf2:eth2"]
    - endpoints: ["spine2:eth3", "leaf3:eth2"]
    - endpoints: ["spine2:eth4", "leaf4:eth2"]
