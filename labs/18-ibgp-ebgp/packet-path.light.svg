<text x="24" y="30" font-size="12.5" font-weight="600" fill="#57606a">18 · iBGP next-hop-self over an OSPF core</text>
<text x="776" y="30" font-size="11" fill="#57606a" text-anchor="end">&#8635; 24.1s loop</text>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0104;0.1805;0.1909;1" dur="24.1s" repeatCount="indefinite"/><text x="400.0" y="195" font-size="13" fill="#1f2328" text-anchor="middle">OSPF area 0 floods loopback and link LSAs, so edge1 and edge2 can reach each other's loopbacks for iBGP.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0104;0.1805;0.1909;1" dur="24.1s" repeatCount="indefinite"/><text x="24" y="223" font-size="10" fill="#57606a">step 1/5</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1909;0.2012;0.334;0.3444;1" dur="24.1s" repeatCount="indefinite"/><text x="400.0" y="195" font-size="13" fill="#1f2328" text-anchor="middle">isp1 (AS 65100) advertises 203.0.113.0/24 over eBGP; the next hop is isp1's interface 192.0.2.2.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1909;0.2012;0.334;0.3444;1" dur="24.1s" repeatCount="indefinite"/><text x="24" y="223" font-size="10" fill="#57606a">step 2/5</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3444;0.3548;0.5415;0.5519;1" dur="24.1s" repeatCount="indefinite"/><text x="400.0" y="195" font-size="13" fill="#1f2328" text-anchor="middle">edge1 re-advertises to edge2 over iBGP with next-hop-self — the next hop becomes edge1's loopback</text><text x="400.0" y="212" font-size="13" fill="#1f2328" text-anchor="middle">1.1.1.1.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3444;0.3548;0.5415;0.5519;1" dur="24.1s" repeatCount="indefinite"/><text x="24" y="223" font-size="10" fill="#57606a">step 3/5</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5519;0.5622;0.6992;0.7095;1" dur="24.1s" repeatCount="indefinite"/><text x="400.0" y="195" font-size="13" fill="#1f2328" text-anchor="middle">Without next-hop-self the next hop would stay 192.0.2.2, a subnet edge2 cannot reach; OSPF resolves</text><text x="400.0" y="212" font-size="13" fill="#1f2328" text-anchor="middle">1.1.1.1 instead.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5519;0.5622;0.6992;0.7095;1" dur="24.1s" repeatCount="indefinite"/><text x="24" y="223" font-size="10" fill="#57606a">step 4/5</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.7095;0.7199;0.9896;1" dur="24.1s" repeatCount="indefinite"/><text x="400.0" y="195" font-size="13" fill="#1f2328" text-anchor="middle">A flow to 203.0.113.0/24 now forwards: edge2 → core → edge1 → isp1, following the OSPF-resolved next</text><text x="400.0" y="212" font-size="13" fill="#1f2328" text-anchor="middle">hop.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.7095;0.7199;0.9896;1" dur="24.1s" repeatCount="indefinite"/><text x="24" y="223" font-size="10" fill="#57606a">step 5/5</text></g>
