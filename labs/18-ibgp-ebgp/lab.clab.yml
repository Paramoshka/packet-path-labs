name: pp18

topology:
  defaults:
    kind: linux
    image: "${FRR_IMAGE:=quay.io/frrouting/frr:10.7.1}"
    sysctls: {net.ipv4.ip_forward: 1}
  nodes:
    edge1:
      binds: ["configs/daemons:/etc/frr/daemons:ro", "configs/edge1.conf:/etc/frr/frr.conf:ro"]
      exec: ["ip addr add 10.0.1.1/30 dev eth1", "ip addr add 192.0.2.1/30 dev eth2", "ip addr add 1.1.1.1/32 dev lo"]
    core:
      binds: ["configs/daemons:/etc/frr/daemons:ro", "configs/core.conf:/etc/frr/frr.conf:ro"]
      exec: ["ip addr add 10.0.1.2/30 dev eth1", "ip addr add 10.0.2.1/30 dev eth2"]
    edge2:
      binds: ["configs/daemons:/etc/frr/daemons:ro", "configs/edge2.conf:/etc/frr/frr.conf:ro"]
      exec: ["ip addr add 10.0.2.2/30 dev eth1", "ip addr add 198.51.100.1/30 dev eth2", "ip addr add 2.2.2.2/32 dev lo"]
    isp1:
      binds: ["configs/daemons:/etc/frr/daemons:ro", "configs/isp1.conf:/etc/frr/frr.conf:ro"]
      exec: ["ip addr add 192.0.2.2/30 dev eth1"]
    isp2:
      binds: ["configs/daemons:/etc/frr/daemons:ro", "configs/isp2.conf:/etc/frr/frr.conf:ro"]
      exec: ["ip addr add 198.51.100.2/30 dev eth1"]
  links:
    - endpoints: ["edge1:eth1", "core:eth1"]
    - endpoints: ["core:eth2", "edge2:eth1"]
    - endpoints: ["edge1:eth2", "isp1:eth1"]
    - endpoints: ["edge2:eth2", "isp2:eth1"]
