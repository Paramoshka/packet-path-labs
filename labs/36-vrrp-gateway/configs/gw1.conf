global_defs {
 router_id GW1
}
vrrp_sync_group GATEWAYS {
 group {
  LAN
  WAN
 }
}
vrrp_instance LAN {
 state BACKUP
 interface eth1
 virtual_router_id 36
 priority 150
 advert_int 1
 unicast_src_ip 10.36.0.2
 unicast_peer {
  10.36.0.3
 }
 virtual_ipaddress {
  10.36.0.1/24 dev eth1
 }
 track_interface {
  eth2
 }
}
vrrp_instance WAN {
 state BACKUP
 interface eth2
 virtual_router_id 37
 priority 150
 advert_int 1
 unicast_src_ip 10.36.1.2
 unicast_peer {
  10.36.1.3
 }
 virtual_ipaddress {
  10.36.1.254/24 dev eth2
 }
 track_interface {
  eth1
 }
}
