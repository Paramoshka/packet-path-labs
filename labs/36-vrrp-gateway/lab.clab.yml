name: pp36
topology:
  defaults:
    kind: linux
    image: ${LAB_IMAGE:=alpine:3.22}
    cmd: sleep infinity
  nodes:
    client:
      exec:
      - apk add --no-cache iproute2 iputils tcpdump curl
      - ip addr add 10.36.0.10/24 dev eth1
      - ip route add 10.36.1.0/24 via 10.36.0.1
    lan:
      exec:
      - apk add --no-cache iproute2 tcpdump
      - ip link add br0 type bridge
      - ip link set br0 up
      - ip link set eth1 master br0
      - ip link set eth2 master br0
      - ip link set eth3 master br0
    wan:
      exec:
      - apk add --no-cache iproute2 tcpdump
      - ip link add br0 type bridge
      - ip link set br0 up
      - ip link set eth1 master br0
      - ip link set eth2 master br0
      - ip link set eth3 master br0
    server:
      exec:
      - apk add --no-cache iproute2 iputils tcpdump curl
      - ip addr add 10.36.1.10/24 dev eth1
      - ip route add 10.36.0.0/24 via 10.36.1.254
    gw1:
      exec:
      - apk add --no-cache iproute2 iputils tcpdump keepalived
      - ip addr add 10.36.0.2/24 dev eth1
      - ip addr add 10.36.1.2/24 dev eth2
      - keepalived --use-file=/etc/lab/keepalived.conf --log-console
      sysctls:
        net.ipv4.ip_forward: 1
      binds:
      - configs/gw1.conf:/etc/lab/keepalived.conf:ro
    gw2:
      exec:
      - apk add --no-cache iproute2 iputils tcpdump keepalived
      - ip addr add 10.36.0.3/24 dev eth1
      - ip addr add 10.36.1.3/24 dev eth2
      - keepalived --use-file=/etc/lab/keepalived.conf --log-console
      sysctls:
        net.ipv4.ip_forward: 1
      binds:
      - configs/gw2.conf:/etc/lab/keepalived.conf:ro
  links:
  - endpoints:
    - client:eth1
    - lan:eth1
  - endpoints:
    - gw1:eth1
    - lan:eth2
  - endpoints:
    - gw2:eth1
    - lan:eth3
  - endpoints:
    - server:eth1
    - wan:eth1
  - endpoints:
    - gw1:eth2
    - wan:eth2
  - endpoints:
    - gw2:eth2
    - wan:eth3
