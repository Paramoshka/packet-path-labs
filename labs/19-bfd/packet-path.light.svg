<text x="776" y="30" font-size="11" fill="#57606a" text-anchor="end">&#8635; 20s loop</text>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0125;0.2625;0.275;1" dur="20s" repeatCount="indefinite"/><text x="400.0" y="217" font-size="13" fill="#1f2328" text-anchor="middle">eBGP is Established; BFD profile fast sends control packets every 100 ms each way, detect multiplier 3.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0125;0.2625;0.275;1" dur="20s" repeatCount="indefinite"/><text x="24" y="245" font-size="10" fill="#57606a">step 1/5</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.275;0.2875;0.4125;0.425;1" dur="20s" repeatCount="indefinite"/><text x="400.0" y="217" font-size="13" fill="#1f2328" text-anchor="middle">The link fails: BFD control packets stop arriving, and each end counts missed intervals.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.275;0.2875;0.4125;0.425;1" dur="20s" repeatCount="indefinite"/><text x="24" y="245" font-size="10" fill="#57606a">step 2/5</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.425;0.4375;0.5825;0.595;1" dur="20s" repeatCount="indefinite"/><text x="400.0" y="217" font-size="13" fill="#1f2328" text-anchor="middle">3 × 100 ms ≈ 300 ms after the last received packet, BFD declares the session Down — sub-second</text><text x="400.0" y="234" font-size="13" fill="#1f2328" text-anchor="middle">detection.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.425;0.4375;0.5825;0.595;1" dur="20s" repeatCount="indefinite"/><text x="24" y="245" font-size="10" fill="#57606a">step 3/5</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.595;0.6075;0.7525;0.765;1" dur="20s" repeatCount="indefinite"/><text x="400.0" y="217" font-size="13" fill="#1f2328" text-anchor="middle">BGP is notified immediately and tears the session down; there is no wait for the 180 s hold timer.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.595;0.6075;0.7525;0.765;1" dur="20s" repeatCount="indefinite"/><text x="24" y="245" font-size="10" fill="#57606a">step 4/5</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.765;0.7775;0.9875;1" dur="20s" repeatCount="indefinite"/><text x="400.0" y="217" font-size="13" fill="#1f2328" text-anchor="middle">Without BFD, eBGP would keep the session (and traffic black-holing) until the hold timer expires — up to</text><text x="400.0" y="234" font-size="13" fill="#1f2328" text-anchor="middle">180 s.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.765;0.7775;0.9875;1" dur="20s" repeatCount="indefinite"/><text x="24" y="245" font-size="10" fill="#57606a">step 5/5</text></g>
