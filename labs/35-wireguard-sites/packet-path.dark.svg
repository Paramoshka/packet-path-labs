<text x="24" y="30" font-size="12.5" font-weight="600" fill="#8b949e">35 · WireGuard site-to-site tunnel</text>
<text x="776" y="30" font-size="11" fill="#8b949e" text-anchor="end">&#8635; 18.5s loop</text>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0135;0.1649;0.1784;1" dur="18.5s" repeatCount="indefinite"/><text x="400.0" y="195" font-size="13" fill="#e6edf3" text-anchor="middle">h1 pings 10.35.2.10 across sites. The LAN frame is plaintext; gw1 routes 10.35.2.0/24 into wg0.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0135;0.1649;0.1784;1" dur="18.5s" repeatCount="indefinite"/><text x="24" y="223" font-size="10" fill="#8b949e">step 1/4</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1784;0.1919;0.3865;0.4;1" dur="18.5s" repeatCount="indefinite"/><text x="400.0" y="195" font-size="13" fill="#e6edf3" text-anchor="middle">gw1 encrypts the whole inner IP packet: outer UDP/51820 to endpoint 198.51.100.2 crosses the WAN.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1784;0.1919;0.3865;0.4;1" dur="18.5s" repeatCount="indefinite"/><text x="24" y="223" font-size="10" fill="#8b949e">step 2/4</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4;0.4135;0.5649;0.5784;1" dur="18.5s" repeatCount="indefinite"/><text x="400.0" y="195" font-size="13" fill="#e6edf3" text-anchor="middle">gw2 decrypts, validates the source against AllowedIPs, and forwards the inner packet to h2 on its LAN.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4;0.4135;0.5649;0.5784;1" dur="18.5s" repeatCount="indefinite"/><text x="24" y="223" font-size="10" fill="#8b949e">step 3/4</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5784;0.5919;0.9865;1" dur="18.5s" repeatCount="indefinite"/><text x="400.0" y="195" font-size="13" fill="#e6edf3" text-anchor="middle">The reply re-encrypts between gateways; h1 sees plain ICMP. UDP/51820 overhead is why wg0 uses MTU 1420.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5784;0.5919;0.9865;1" dur="18.5s" repeatCount="indefinite"/><text x="24" y="223" font-size="10" fill="#8b949e">step 4/4</text></g>
