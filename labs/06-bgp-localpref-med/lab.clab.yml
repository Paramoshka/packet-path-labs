name: pp06

topology:
  defaults:
    kind: linux
    image: "${FRR_IMAGE:=quay.io/frrouting/frr:10.7.1}"
    sysctls: {net.ipv4.ip_forward: 1}
  nodes:
    edge1:
      binds: ["configs/daemons:/etc/frr/daemons:ro", "configs/edge1.conf:/etc/frr/frr.conf:ro"]
      exec: ["ip addr add 10.0.0.1/30 dev eth1", "ip addr add 192.0.2.1/30 dev eth2"]
    edge2:
      binds: ["configs/daemons:/etc/frr/daemons:ro", "configs/edge2.conf:/etc/frr/frr.conf:ro"]
      exec: ["ip addr add 10.0.0.2/30 dev eth1", "ip addr add 192.0.2.5/30 dev eth2"]
    up1:
      binds: ["configs/daemons:/etc/frr/daemons:ro", "configs/up1.conf:/etc/frr/frr.conf:ro"]
      exec: ["ip addr add 192.0.2.2/30 dev eth1"]
    up2:
      binds: ["configs/daemons:/etc/frr/daemons:ro", "configs/up2.conf:/etc/frr/frr.conf:ro"]
      exec: ["ip addr add 192.0.2.6/30 dev eth1"]
  links:
    - endpoints: ["edge1:eth1", "edge2:eth1"]
    - endpoints: ["edge1:eth2", "up1:eth1"]
    - endpoints: ["edge2:eth2", "up2:eth1"]
