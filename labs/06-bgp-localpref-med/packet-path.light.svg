<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1872;0.1995;0.3571;0.3695;1" dur="20.3s" repeatCount="indefinite"/><text x="24" y="373" font-size="10" fill="#57606a">step 2/5</text></g>
