title: Local-pref beats MED; MED picks the exit
iface_labels: false
layout:
  rows:
    - [up1, up2]
    - [edge1, edge2]
  x: {up1: 240, up2: 560, edge1: 240, edge2: 560}
links:
  - between: [up1, edge1]
    label: MED 50
  - between: [up2, edge2]
    label: MED 200
  - between: [edge1, edge2]
    label: 'iBGP · 10.0.0.0/30'
nodes:
  up1: {sub: ['AS 65100', '192.0.2.2/30']}
  up2: {sub: ['AS 65100', '192.0.2.6/30']}
  edge1: {sub: ['AS 65000', '10.0.0.1 · 192.0.2.1']}
  edge2: {sub: ['AS 65000', '10.0.0.2 · 192.0.2.5']}
steps:
  - text: 'Both upstreams in AS 65100 announce 203.0.113.0/24: up1 sets MED 50, up2 sets MED 200.'
    packets:
      - {from: up1, to: edge1, kind: bgp, label: '203.0.113.0/24 · MED 50', dur: 1.4}
      - {from: up2, to: edge2, kind: bgp, label: '203.0.113.0/24 · MED 200', delay: 0.3, dur: 1.4}
  - text: 'edge2 applies HIGH-LOCALPREF inbound: LOCAL_PREF 200 travels to edge1 over iBGP.'
    packets:
      - {from: edge2, to: edge1, kind: bgp, label: 'LOCAL_PREF 200 · next-hop-self', dur: 1.6}
  - text: 'Local-pref outranks MED: edge1 sends traffic for 203.0.113.0/24 to edge2, despite MED 200.'
    packets:
      - legs:
          - {from: edge1, to: edge2, kind: tcp, label: 'to 203.0.113.0/24', dur: 1.2}
          - {from: edge2, to: up2, kind: tcp, dur: 1.2}
  - text: 'Remove HIGH-LOCALPREF: both paths drop to LOCAL_PREF 100, so MED becomes the tiebreaker.'
    dur: 1.8
  - text: 'MED 50 beats MED 200 within AS 65100: the exit flips to the direct path edge1 → up1.'
    packets:
      - {from: edge1, to: up1, kind: tcp, label: 'to 203.0.113.0/24', dur: 1.4}
badges:
  - {node: edge2, text: LOCAL_PREF 200, kind: bgp, steps: [1, 3]}
  - {node: edge1, text: 'best: via edge2 (LP 200)', kind: tcp, steps: [1, 3]}
  - {node: edge1, text: 'best: via up1 (MED 50)', kind: tcp, steps: [3, 5]}
