<text x="776" y="30" font-size="11" fill="#8b949e" text-anchor="end">&#8635; 20.9s loop</text>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.012;0.1651;0.177;1" dur="20.9s" repeatCount="indefinite"/><text x="400.0" y="195" font-size="13" fill="#e6edf3" text-anchor="middle">dig @10.32.0.1 app.lab.test A: the client sends a recursive query (RD=1) over UDP/53.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.012;0.1651;0.177;1" dur="20.9s" repeatCount="indefinite"/><text x="24" y="223" font-size="10" fill="#8b949e">step 1/5</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.177;0.189;0.3421;0.3541;1" dur="20.9s" repeatCount="indefinite"/><text x="400.0" y="195" font-size="13" fill="#e6edf3" text-anchor="middle">Cache miss: the resolver's forward-only zone lab.test sends the query to auth 10.32.1.2.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.177;0.189;0.3421;0.3541;1" dur="20.9s" repeatCount="indefinite"/><text x="24" y="223" font-size="10" fill="#8b949e">step 2/5</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3541;0.366;0.5191;0.5311;1" dur="20.9s" repeatCount="indefinite"/><text x="400.0" y="195" font-size="13" fill="#e6edf3" text-anchor="middle">auth is authoritative for lab.test (recursion off): it answers A 192.0.2.80 with AA=1, TTL 30.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3541;0.366;0.5191;0.5311;1" dur="20.9s" repeatCount="indefinite"/><text x="24" y="223" font-size="10" fill="#8b949e">step 3/5</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5311;0.5431;0.6962;0.7081;1" dur="20.9s" repeatCount="indefinite"/><text x="400.0" y="195" font-size="13" fill="#e6edf3" text-anchor="middle">The resolver caches the record and relays the answer to the client with RA=1.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5311;0.5431;0.6962;0.7081;1" dur="20.9s" repeatCount="indefinite"/><text x="24" y="223" font-size="10" fill="#8b949e">step 4/5</text></g>
