title: DNS forwarding and caching
layout:
  rows:
    - [client, resolver, auth]
links:
  - between: [client, resolver]
    label: 10.32.0.0/24
  - between: [resolver, auth]
    label: 10.32.1.0/24
nodes:
  client: {sub: 10.32.0.2/24}
  resolver: {sub: ['10.32.0.1 · 10.32.1.1', 'forward lab.test → auth']}
  auth: {sub: ['10.32.1.2/24', 'primary lab.test']}
steps:
  - text: 'dig @10.32.0.1 app.lab.test A: the client sends a recursive query (RD=1) over UDP/53.'
    packets:
      - {from: client, to: resolver, kind: udp, label: 'A? app.lab.test · RD=1', dur: 1.6}
  - text: 'Cache miss: the resolver''s forward-only zone lab.test sends the query to auth 10.32.1.2.'
    packets:
      - {from: resolver, to: auth, kind: udp, label: 'forward · A? app.lab.test', pulse: true, dur: 1.6}
  - text: 'auth is authoritative for lab.test (recursion off): it answers A 192.0.2.80 with AA=1, TTL 30.'
    packets:
      - {from: auth, to: resolver, kind: udp, label: 'A 192.0.2.80 · AA · TTL 30', dur: 1.6}
  - text: The resolver caches the record and relays the answer to the client with RA=1.
    packets:
      - {from: resolver, to: client, kind: udp, label: 'A 192.0.2.80 · RA · TTL 30', pulse: true, dur: 1.6}
  - text: 'A second dig within 30 s is a cache hit: the resolver answers directly with a counting-down TTL.'
    packets:
      - {from: client, to: resolver, kind: udp, label: 'A? app.lab.test', dur: 1.2}
      - {from: resolver, to: client, kind: udp, label: 'A 192.0.2.80 · TTL 23', delay: 1.9, dur: 1.2}
badges:
  - {node: resolver, text: 'cache MISS · forward only', kind: data, steps: [1, 3]}
  - {node: resolver, text: 'record cached · TTL 30', kind: icmp, steps: [3, 4]}
  - {node: resolver, text: 'cache HIT', kind: icmp, steps: [4, 5]}
  - {node: auth, text: 'AA=1 · primary lab.test', kind: icmp, steps: [2, 4]}
