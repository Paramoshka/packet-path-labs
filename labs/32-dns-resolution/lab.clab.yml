name: pp32
topology:
  defaults:
    kind: linux
    image: ${LAB_IMAGE:=alpine:3.22}
    cmd: sleep infinity
  nodes:
    client:
      exec:
      - apk add --no-cache iproute2 iputils tcpdump bind-tools
      - ip addr add 10.32.0.2/24 dev eth1
      - ip route add 10.32.1.0/24 via 10.32.0.1
    resolver:
      exec:
      - apk add --no-cache iproute2 iputils tcpdump bind bind-tools iptables
      - ip addr add 10.32.0.1/24 dev eth1
      - ip addr add 10.32.1.1/24 dev eth2
      - mkdir -p /var/cache/bind
      - named -u root -c /etc/lab/named.conf
      sysctls:
        net.ipv4.ip_forward: 1
      binds:
      - configs/resolver.conf:/etc/lab/named.conf:ro
    auth:
      exec:
      - apk add --no-cache iproute2 iputils tcpdump bind bind-tools
      - ip addr add 10.32.1.2/24 dev eth1
      - ip route add 10.32.0.0/24 via 10.32.1.1
      - mkdir -p /var/cache/bind
      - named -u root -c /etc/lab/named.conf
      binds:
      - configs/auth.conf:/etc/lab/named.conf:ro
      - configs/lab.test.zone:/etc/lab/lab.test.zone:ro
  links:
  - endpoints:
    - client:eth1
    - resolver:eth1
  - endpoints:
    - resolver:eth2
    - auth:eth1
