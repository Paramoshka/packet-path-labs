frr defaults traditional
hostname r2
log stdout
service integrated-vtysh-config
!
bgp community-list standard BLUE permit 65001:100
route-map EXPORT-BLUE permit 10
 match community BLUE
!
router bgp 65002
 neighbor 10.0.12.1 remote-as 65001
 neighbor 10.0.23.2 remote-as 65003
 address-family ipv4 unicast
  neighbor 10.0.12.1 activate
  neighbor 10.0.23.2 activate
  neighbor 10.0.23.2 route-map EXPORT-BLUE out
 exit-address-family
!
