frr defaults traditional
hostname r1
log stdout
service integrated-vtysh-config
!
ip route 10.10.10.0/24 Null0
ip route 10.20.20.0/24 Null0
!
ip prefix-list BLUE seq 5 permit 10.10.10.0/24
ip prefix-list RED seq 5 permit 10.20.20.0/24
route-map TAG permit 10
 match ip address prefix-list BLUE
 set community 65001:100
route-map TAG permit 20
 match ip address prefix-list RED
 set community 65001:200
!
router bgp 65001
 neighbor 10.0.12.2 remote-as 65002
 address-family ipv4 unicast
  network 10.10.10.0/24
  network 10.20.20.0/24
  neighbor 10.0.12.2 activate
  neighbor 10.0.12.2 route-map TAG out
  neighbor 10.0.12.2 send-community
 exit-address-family
!
