<text x="776" y="30" font-size="11" fill="#8b949e" text-anchor="end">&#8635; 24s loop</text>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0104;0.1812;0.1917;1" dur="24s" repeatCount="indefinite"/><text x="400.0" y="188" font-size="13" fill="#e6edf3" text-anchor="middle">h1 and h2 sit in VLAN 10 on sw1's filtering bridge; h1 broadcasts an ARP request for 10.10.10.12.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0104;0.1812;0.1917;1" dur="24s" repeatCount="indefinite"/><text x="24" y="216" font-size="10" fill="#8b949e">step 1/5</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1917;0.2021;0.3729;0.3833;1" dur="24s" repeatCount="indefinite"/><text x="400.0" y="188" font-size="13" fill="#e6edf3" text-anchor="middle">sw1 floods only inside VLAN 10; h2 answers unicast and the bridge learns both MACs in its FDB.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1917;0.2021;0.3729;0.3833;1" dur="24s" repeatCount="indefinite"/><text x="24" y="216" font-size="10" fill="#8b949e">step 2/5</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3833;0.3937;0.6646;0.675;1" dur="24s" repeatCount="indefinite"/><text x="400.0" y="188" font-size="13" fill="#e6edf3" text-anchor="middle">Same VLAN, same subnet — the ICMP echo crosses sw1 untagged and the reply comes straight back.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3833;0.3937;0.6646;0.675;1" dur="24s" repeatCount="indefinite"/><text x="24" y="216" font-size="10" fill="#8b949e">step 3/5</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.675;0.6854;0.8104;0.8208;1" dur="24s" repeatCount="indefinite"/><text x="400.0" y="188" font-size="13" fill="#e6edf3" text-anchor="middle">Now move h2's port to VLAN 20: h1 retries ARP, but sw1 floods the request only inside VLAN 10.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.675;0.6854;0.8104;0.8208;1" dur="24s" repeatCount="indefinite"/><text x="24" y="216" font-size="10" fill="#8b949e">step 4/5</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.8208;0.8312;0.9896;1" dur="24s" repeatCount="indefinite"/><text x="400.0" y="188" font-size="13" fill="#e6edf3" text-anchor="middle">No VLAN 10 member owns that IP, so no reply ever comes back — separate VLANs, separate broadcast</text><text x="400.0" y="205" font-size="13" fill="#e6edf3" text-anchor="middle">domains.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.8208;0.8312;0.9896;1" dur="24s" repeatCount="indefinite"/><text x="24" y="216" font-size="10" fill="#8b949e">step 5/5</text></g>
