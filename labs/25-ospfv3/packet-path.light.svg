<text x="24" y="30" font-size="12.5" font-weight="600" fill="#57606a">25 · OSPFv3 adjacencies and IPv6 forwarding</text>
<text x="776" y="30" font-size="11" fill="#57606a" text-anchor="end">&#8635; 22.2s loop</text>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0113;0.1419;0.1532;1" dur="22.2s" repeatCount="indefinite"/><text x="400.0" y="195" font-size="13" fill="#1f2328" text-anchor="middle">OSPFv3 hellos use link-local sources and the ff02::5 multicast; neighbors form per interface.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0113;0.1419;0.1532;1" dur="22.2s" repeatCount="indefinite"/><text x="24" y="223" font-size="10" fill="#57606a">step 1/5</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1532;0.1644;0.3626;0.3739;1" dur="22.2s" repeatCount="indefinite"/><text x="400.0" y="195" font-size="13" fill="#1f2328" text-anchor="middle">LSAs flood area 0.0.0.0; OSPFv3 carries prefixes in Intra-Area-Prefix LSAs, not router-LSAs.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1532;0.1644;0.3626;0.3739;1" dur="22.2s" repeatCount="indefinite"/><text x="24" y="223" font-size="10" fill="#57606a">step 2/5</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3739;0.3851;0.4977;0.509;1" dur="22.2s" repeatCount="indefinite"/><text x="400.0" y="195" font-size="13" fill="#1f2328" text-anchor="middle">Every router runs SPF on the synced LSDB; r3 installs 2001:db8:1::1/128 via r2's link-local.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3739;0.3851;0.4977;0.509;1" dur="22.2s" repeatCount="indefinite"/><text x="24" y="223" font-size="10" fill="#57606a">step 3/5</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.509;0.5203;0.723;0.7342;1" dur="22.2s" repeatCount="indefinite"/><text x="400.0" y="195" font-size="13" fill="#1f2328" text-anchor="middle">r1 pings r3's loopback 2001:db8:3::3; the echo follows the SPF path through r2.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.509;0.5203;0.723;0.7342;1" dur="22.2s" repeatCount="indefinite"/><text x="24" y="223" font-size="10" fill="#57606a">step 4/5</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.7342;0.7455;0.9887;1" dur="22.2s" repeatCount="indefinite"/><text x="400.0" y="195" font-size="13" fill="#1f2328" text-anchor="middle">The reply returns along the same area-0 path; OSPFv3 next-hops are link-local addresses.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.7342;0.7455;0.9887;1" dur="22.2s" repeatCount="indefinite"/><text x="24" y="223" font-size="10" fill="#57606a">step 5/5</text></g>
