name: pp25

topology:
  defaults: {kind: linux, image: "${FRR_IMAGE:=quay.io/frrouting/frr:10.7.1}"}
  nodes:
    r1:
      binds: ["configs/daemons:/etc/frr/daemons:ro", "configs/r1.conf:/etc/frr/frr.conf:ro"]
      exec: ["ip -6 addr add 2001:db8:12::1/64 dev eth1", "ip -6 addr add 2001:db8:1::1/128 dev lo"]
    r2:
      binds: ["configs/daemons:/etc/frr/daemons:ro", "configs/r2.conf:/etc/frr/frr.conf:ro"]
      exec: ["ip -6 addr add 2001:db8:12::2/64 dev eth1", "ip -6 addr add 2001:db8:23::1/64 dev eth2", "ip -6 addr add 2001:db8:2::2/128 dev lo"]
    r3:
      binds: ["configs/daemons:/etc/frr/daemons:ro", "configs/r3.conf:/etc/frr/frr.conf:ro"]
      exec: ["ip -6 addr add 2001:db8:23::2/64 dev eth1", "ip -6 addr add 2001:db8:3::3/128 dev lo"]
  links:
    - endpoints: ["r1:eth1", "r2:eth1"]
    - endpoints: ["r2:eth2", "r3:eth1"]
