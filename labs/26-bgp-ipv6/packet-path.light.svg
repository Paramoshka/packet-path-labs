<g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0117;0.1479;0.1596;1" dur="21.3s" repeatCount="indefinite"/><text x="400.0" y="217" font-size="13" fill="#1f2328" text-anchor="middle">eBGP sessions come up over IPv6 TCP/179 on the 2001:db8:12::/64 and 2001:db8:23::/64 links.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0117;0.1479;0.1596;1" dur="21.3s" repeatCount="indefinite"/><text x="24" y="245" font-size="10" fill="#57606a">step 1/5</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1596;0.1714;0.3122;0.3239;1" dur="21.3s" repeatCount="indefinite"/><text x="400.0" y="217" font-size="13" fill="#1f2328" text-anchor="middle">r3 originates 2001:db8:3::3/128 into address-family ipv6 unicast; the UPDATE carries IPv6 NLRI.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1596;0.1714;0.3122;0.3239;1" dur="21.3s" repeatCount="indefinite"/><text x="24" y="245" font-size="10" fill="#57606a">step 2/5</text></g>
