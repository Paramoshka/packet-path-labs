<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3239;0.3357;0.4765;0.4883;1" dur="21.3s" repeatCount="indefinite"/><text x="24" y="245" font-size="10" fill="#57606a">step 3/5</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4883;0.5;0.7113;0.723;1" dur="21.3s" repeatCount="indefinite"/><text x="400.0" y="217" font-size="13" fill="#1f2328" text-anchor="middle">r1 pings 2001:db8:3::3: the BGP route resolves via next-hop 2001:db8:12::2, then 2001:db8:23::2.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4883;0.5;0.7113;0.723;1" dur="21.3s" repeatCount="indefinite"/><text x="24" y="245" font-size="10" fill="#57606a">step 4/5</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.723;0.7347;0.9883;1" dur="21.3s" repeatCount="indefinite"/><text x="400.0" y="217" font-size="13" fill="#1f2328" text-anchor="middle">The echo reply follows the reverse path; IPv6 NLRI and next-hop behavior mirror IPv4 BGP.</text></g>
