<text x="24" y="30" font-size="12.5" font-weight="600" fill="#8b949e">13 · VRF — one subnet in two isolated tables</text>
<text x="776" y="30" font-size="11" fill="#8b949e" text-anchor="end">&#8635; 18.5s loop</text>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0135;0.1811;0.1946;1" dur="18.5s" repeatCount="indefinite"/><text x="400.0" y="217" font-size="13" fill="#e6edf3" text-anchor="middle">r1 enforces two VRFs: eth1 belongs to vrf-blue (table 100), eth2 to vrf-red (table 200) — the same</text><text x="400.0" y="234" font-size="13" fill="#e6edf3" text-anchor="middle">subnet exists twice.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0135;0.1811;0.1946;1" dur="18.5s" repeatCount="indefinite"/><text x="24" y="245" font-size="10" fill="#8b949e">step 1/4</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1946;0.2081;0.4622;0.4757;1" dur="18.5s" repeatCount="indefinite"/><text x="400.0" y="217" font-size="13" fill="#e6edf3" text-anchor="middle">From vrf-blue, ping 10.0.0.2 looks up table 100 only and reaches the blue host; the reply stays in table</text><text x="400.0" y="234" font-size="13" fill="#e6edf3" text-anchor="middle">100.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1946;0.2081;0.4622;0.4757;1" dur="18.5s" repeatCount="indefinite"/><text x="24" y="245" font-size="10" fill="#8b949e">step 2/4</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4757;0.4892;0.7432;0.7568;1" dur="18.5s" repeatCount="indefinite"/><text x="400.0" y="217" font-size="13" fill="#e6edf3" text-anchor="middle">The very same destination IP from vrf-red hits table 200 and reaches the red host — no address conflict.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4757;0.4892;0.7432;0.7568;1" dur="18.5s" repeatCount="indefinite"/><text x="24" y="245" font-size="10" fill="#8b949e">step 3/4</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.7568;0.7703;0.9865;1" dur="18.5s" repeatCount="indefinite"/><text x="400.0" y="217" font-size="13" fill="#e6edf3" text-anchor="middle">Without route leaking the tables never exchange routes: blue and red remain two isolated worlds.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.7568;0.7703;0.9865;1" dur="18.5s" repeatCount="indefinite"/><text x="24" y="245" font-size="10" fill="#8b949e">step 4/4</text></g>
