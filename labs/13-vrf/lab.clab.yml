name: pp13

topology:
  nodes:
    blue:
      kind: linux
      image: "${LINUX_IMAGE:=ghcr.io/srl-labs/network-multitool:latest}"
      exec: ["ip addr add 10.0.0.2/24 dev eth1", "ip route add default via 10.0.0.1"]
    r1:
      kind: linux
      image: "${LINUX_IMAGE:=ghcr.io/srl-labs/network-multitool:latest}"
      sysctls: {net.ipv4.ip_forward: 1}
      exec:
        - ip link add vrf-blue type vrf table 100
        - ip link add vrf-red type vrf table 200
        - ip link set vrf-blue up
        - ip link set vrf-red up
        - ip link set eth1 master vrf-blue
        - ip link set eth2 master vrf-red
        - ip addr add 10.0.0.1/24 dev eth1
        - ip addr add 10.0.0.1/24 dev eth2
    red:
      kind: linux
      image: "${LINUX_IMAGE:=ghcr.io/srl-labs/network-multitool:latest}"
      exec: ["ip addr add 10.0.0.2/24 dev eth1", "ip route add default via 10.0.0.1"]
  links:
    - endpoints: ["blue:eth1", "r1:eth1"]
    - endpoints: ["red:eth1", "r1:eth2"]
