<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4852;0.5;0.7012;0.716;1" dur="16.9s" repeatCount="indefinite"/><text x="24" y="216" font-size="10" fill="#57606a">step 3/4</text></g>
