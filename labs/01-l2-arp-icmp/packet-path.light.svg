<text x="776" y="30" font-size="11" fill="#57606a" text-anchor="end">&#8635; 16.9s loop</text>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0148;0.2278;0.2426;1" dur="16.9s" repeatCount="indefinite"/><text x="400.0" y="188" font-size="13" fill="#1f2328" text-anchor="middle">pc1 has no neighbor entry for 10.0.0.2, so it broadcasts an ARP request.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0148;0.2278;0.2426;1" dur="16.9s" repeatCount="indefinite"/><text x="24" y="216" font-size="10" fill="#57606a">step 1/4</text></g>
