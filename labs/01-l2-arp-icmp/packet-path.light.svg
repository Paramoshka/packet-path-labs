<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2426;0.2574;0.4704;0.4852;1" dur="16.9s" repeatCount="indefinite"/><text x="24" y="216" font-size="10" fill="#57606a">step 2/4</text></g>
