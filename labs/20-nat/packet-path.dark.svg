<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2298;0.2453;0.4565;0.472;1" dur="16.1s" repeatCount="indefinite"/><text x="24" y="223" font-size="10" fill="#8b949e">step 2/4</text></g>
