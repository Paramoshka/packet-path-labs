<text x="24" y="30" font-size="12.5" font-weight="600" fill="#8b949e">02 · Routing between two subnets</text>
<text x="776" y="30" font-size="11" fill="#8b949e" text-anchor="end">&#8635; 22s loop</text>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0114;0.1568;0.1682;1" dur="22s" repeatCount="indefinite"/><text x="400.0" y="188" font-size="13" fill="#e6edf3" text-anchor="middle">10.0.2.2 is off-subnet, so pc1 sends the echo request to its gateway 10.0.1.1 (r1).</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0114;0.1568;0.1682;1" dur="22s" repeatCount="indefinite"/><text x="24" y="216" font-size="10" fill="#8b949e">step 1/5</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1682;0.1795;0.325;0.3364;1" dur="22s" repeatCount="indefinite"/><text x="400.0" y="188" font-size="13" fill="#e6edf3" text-anchor="middle">r1 forwards: TTL 64 becomes 63 and both MAC addresses are rewritten; the IP addresses stay the same.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1682;0.1795;0.325;0.3364;1" dur="22s" repeatCount="indefinite"/><text x="24" y="216" font-size="10" fill="#8b949e">step 2/5</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3364;0.3477;0.5523;0.5636;1" dur="22s" repeatCount="indefinite"/><text x="400.0" y="188" font-size="13" fill="#e6edf3" text-anchor="middle">pc2 replies via its own gateway 10.0.2.1; r1 again decrements TTL and builds fresh L2 headers.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3364;0.3477;0.5523;0.5636;1" dur="22s" repeatCount="indefinite"/><text x="24" y="216" font-size="10" fill="#8b949e">step 3/5</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5636;0.575;0.7205;0.7318;1" dur="22s" repeatCount="indefinite"/><text x="400.0" y="188" font-size="13" fill="#e6edf3" text-anchor="middle">Turn ip_forward off and r1 silently drops transit packets — a route alone cannot forward.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5636;0.575;0.7205;0.7318;1" dur="22s" repeatCount="indefinite"/><text x="24" y="216" font-size="10" fill="#8b949e">step 4/5</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.7318;0.7432;0.9886;1" dur="22s" repeatCount="indefinite"/><text x="400.0" y="188" font-size="13" fill="#e6edf3" text-anchor="middle">Re-enable ip_forward and the ping works again: L3 is end-to-end, L2 is hop-by-hop.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.7318;0.7432;0.9886;1" dur="22s" repeatCount="indefinite"/><text x="24" y="216" font-size="10" fill="#8b949e">step 5/5</text></g>
<rect x="0" y="224" width="0" height="3" rx="1.5" fill="#58a6ff" opacity="0.4"><animate attributeName="width" values="0;800" keyTimes="0;1" dur="22s" repeatCount="indefinite"/></rect>
</svg>
