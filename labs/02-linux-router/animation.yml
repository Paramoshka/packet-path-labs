title: Routing between two subnets
links:
  - between: [pc1, r1]
    label: 10.0.1.0/24
  - between: [r1, pc2]
    label: 10.0.2.0/24
nodes:
  pc1: {sub: 10.0.1.2/24}
  r1: {sub: '10.0.1.1 · 10.0.2.1'}
  pc2: {sub: 10.0.2.2/24}
steps:
  - text: '10.0.2.2 is off-subnet, so pc1 sends the echo request to its gateway 10.0.1.1 (r1).'
    packets:
      - {from: pc1, to: r1, kind: icmp, label: 'echo req · TTL 64', dur: 1.6}
  - text: 'r1 forwards: TTL 64 becomes 63 and both MAC addresses are rewritten; the IP addresses stay the same.'
    packets:
      - {from: r1, to: pc2, kind: icmp, label: 'TTL 63 · new MACs', pulse: true, dur: 1.6}
  - text: pc2 replies via its own gateway 10.0.2.1; r1 again decrements TTL and builds fresh L2 headers.
    packets:
      - legs:
          - {from: pc2, to: r1, kind: icmp, label: 'echo reply · TTL 64', dur: 1.2}
          - {from: r1, to: pc1, kind: icmp, label: 'TTL 63 · new MACs', dur: 1.2}
  - text: Turn ip_forward off and r1 silently drops transit packets — a route alone cannot forward.
    packets:
      - {from: pc1, to: r1, kind: rst, label: 'echo req · dropped', dur: 1.6}
  - text: 'Re-enable ip_forward and the ping works again: L3 is end-to-end, L2 is hop-by-hop.'
    packets:
      - legs:
          - {from: pc1, to: r1, kind: icmp, label: 'echo req · TTL 64', dur: 1.2}
          - {from: r1, to: pc2, kind: icmp, label: 'TTL 63 · new MACs', dur: 1.2}
badges:
  - {node: r1, text: 'ip_forward=1', kind: icmp, steps: [0, 3]}
  - {node: r1, text: 'ip_forward=0', kind: rst, steps: [3, 4]}
  - {node: r1, text: 'ip_forward=1', kind: icmp, steps: [4, 5]}
