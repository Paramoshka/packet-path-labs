name: pp21

topology:
  nodes:
    h1:
      kind: linux
      image: "${LINUX_IMAGE:=ghcr.io/srl-labs/network-multitool:latest}"
      exec: ["ip addr add 10.0.1.2/24 dev eth1", "ip route add 10.0.2.0/24 via 10.0.1.1"]
    fw:
      kind: linux
      image: "${LINUX_IMAGE:=ghcr.io/srl-labs/network-multitool:latest}"
      sysctls: {net.ipv4.ip_forward: 1}
      binds: ["configs/fw.nft:/etc/fw.nft:ro"]
      exec:
        - apk add --no-cache nftables
        - ip addr add 10.0.1.1/24 dev eth1
        - ip addr add 10.0.2.1/24 dev eth2
        - nft -f /etc/fw.nft
    h2:
      kind: linux
      image: "${LINUX_IMAGE:=ghcr.io/srl-labs/network-multitool:latest}"
      exec: ["ip addr add 10.0.2.2/24 dev eth1", "ip route add 10.0.1.0/24 via 10.0.2.1"]
  links:
    - endpoints: ["h1:eth1", "fw:eth1"]
    - endpoints: ["fw:eth2", "h2:eth1"]
