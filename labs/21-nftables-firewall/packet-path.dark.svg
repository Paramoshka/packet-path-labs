<g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0096;0.2893;0.2989;1" dur="26.1s" repeatCount="indefinite"/><text x="400.0" y="195" font-size="13" fill="#e6edf3" text-anchor="middle">ICMP matches "ip protocol icmp accept": echo request and reply pass the firewall both ways.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0096;0.2893;0.2989;1" dur="26.1s" repeatCount="indefinite"/><text x="24" y="223" font-size="10" fill="#8b949e">step 1/5</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2989;0.3084;0.431;0.4406;1" dur="26.1s" repeatCount="indefinite"/><text x="400.0" y="195" font-size="13" fill="#e6edf3" text-anchor="middle">A TCP SYN to port 8080 matches no allow rule, so the forward chain's policy drop discards it.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2989;0.3084;0.431;0.4406;1" dur="26.1s" repeatCount="indefinite"/><text x="24" y="223" font-size="10" fill="#8b949e">step 2/5</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4406;0.4502;0.6226;0.6322;1" dur="26.1s" repeatCount="indefinite"/><text x="400.0" y="195" font-size="13" fill="#e6edf3" text-anchor="middle">Insert a narrow "tcp dport 8080 accept" rule: the SYN passes and conntrack records the new flow.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4406;0.4502;0.6226;0.6322;1" dur="26.1s" repeatCount="indefinite"/><text x="24" y="223" font-size="10" fill="#8b949e">step 3/5</text></g>
