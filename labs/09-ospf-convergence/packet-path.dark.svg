<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3612;0.3722;0.5088;0.5198;1" dur="22.7s" repeatCount="indefinite"/><text x="24" y="516" font-size="10" fill="#8b949e">step 3/5</text></g>
