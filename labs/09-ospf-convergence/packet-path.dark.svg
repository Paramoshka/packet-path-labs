<g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.011;0.2093;0.2203;1" dur="22.7s" repeatCount="indefinite"/><text x="24" y="516" font-size="10" fill="#8b949e">step 1/5</text></g>
