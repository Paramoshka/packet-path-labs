<text x="24" y="30" font-size="12.5" font-weight="600" fill="#57606a">08 · Equal-cost paths and per-flow hashing</text>
<text x="776" y="30" font-size="11" fill="#57606a" text-anchor="end">&#8635; 18.7s loop</text>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0134;0.1898;0.2032;1" dur="18.7s" repeatCount="indefinite"/><text x="400.0" y="488" font-size="13" fill="#1f2328" text-anchor="middle">r4's loopback LSA floods through r2 and r3; r1 sees two equal-cost paths to 4.4.4.4/32.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0134;0.1898;0.2032;1" dur="18.7s" repeatCount="indefinite"/><text x="24" y="516" font-size="10" fill="#57606a">step 1/4</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2032;0.2166;0.361;0.3743;1" dur="18.7s" repeatCount="indefinite"/><text x="400.0" y="488" font-size="13" fill="#1f2328" text-anchor="middle">Equal SPF cost means ECMP: FRR and the kernel install two next hops for 4.4.4.4/32.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2032;0.2166;0.361;0.3743;1" dur="18.7s" repeatCount="indefinite"/><text x="24" y="516" font-size="10" fill="#57606a">step 2/4</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3743;0.3877;0.6497;0.6631;1" dur="18.7s" repeatCount="indefinite"/><text x="400.0" y="488" font-size="13" fill="#1f2328" text-anchor="middle">Flow 1 hashes onto the upper path: r1 → r2 → r4.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3743;0.3877;0.6497;0.6631;1" dur="18.7s" repeatCount="indefinite"/><text x="24" y="516" font-size="10" fill="#57606a">step 3/4</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.6631;0.6765;0.9866;1" dur="18.7s" repeatCount="indefinite"/><text x="400.0" y="488" font-size="13" fill="#1f2328" text-anchor="middle">Flow 2 hashes onto the lower path; per-flow hashing keeps both links active without reordering.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.6631;0.6765;0.9866;1" dur="18.7s" repeatCount="indefinite"/><text x="24" y="516" font-size="10" fill="#57606a">step 4/4</text></g>
