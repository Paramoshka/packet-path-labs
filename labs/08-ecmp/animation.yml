title: Equal-cost paths and per-flow hashing
layout:
  rows:
    - [r2]
    - [r1, r4]
    - [r3]
  x: {r1: 180, r4: 620}
links:
  - between: [r1, r2]
    label: 10.0.12.0/30
  - between: [r1, r3]
    label: 10.0.13.0/30
  - between: [r2, r4]
    label: 10.0.24.0/30
  - between: [r3, r4]
    label: 10.0.34.0/30
nodes:
  r1: {sub: 'lo 1.1.1.1/32'}
  r2: {sub: 'lo 2.2.2.2/32'}
  r3: {sub: 'lo 3.3.3.3/32'}
  r4: {sub: 'lo 4.4.4.4/32'}
steps:
  - text: r4's loopback LSA floods through r2 and r3; r1 sees two equal-cost paths to 4.4.4.4/32.
    packets:
      - {from: r2, to: r1, kind: ospf, label: 'LSA · 4.4.4.4/32', dur: 1.4}
      - {from: r3, to: r1, kind: ospf, label: 'LSA · 4.4.4.4/32', delay: 0.3, dur: 1.4}
  - text: 'Equal SPF cost means ECMP: FRR and the kernel install two next hops for 4.4.4.4/32.'
    dur: 1.6
  - text: 'Flow 1 hashes onto the upper path: r1 → r2 → r4.'
    packets:
      - legs:
          - {from: r1, to: r2, kind: tcp, label: 'flow 1 → 4.4.4.4', dur: 1.4}
          - {from: r2, to: r4, kind: tcp, dur: 1.4}
  - text: Flow 2 hashes onto the lower path; per-flow hashing keeps both links active without reordering.
    packets:
      - legs:
          - {from: r1, to: r3, kind: udp, label: 'flow 2 → 4.4.4.4', dur: 1.4}
          - {from: r3, to: r4, kind: udp, dur: 1.4}
badges:
  - {node: r1, text: 'ECMP: 2 next hops', kind: tcp, steps: [1, 4]}
