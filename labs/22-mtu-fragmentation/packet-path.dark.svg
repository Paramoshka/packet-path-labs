<text x="24" y="30" font-size="12.5" font-weight="600" fill="#8b949e">22 · MTU bottleneck and PMTUD</text>
<text x="776" y="30" font-size="11" fill="#8b949e" text-anchor="end">&#8635; 24.6s loop</text>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0102;0.1402;0.1504;1" dur="24.6s" repeatCount="indefinite"/><text x="400.0" y="210" font-size="13" fill="#e6edf3" text-anchor="middle">ping -M do -s 1400 sends a 1428-byte packet with DF set; it fits h1's 1500-byte link.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0102;0.1402;0.1504;1" dur="24.6s" repeatCount="indefinite"/><text x="24" y="238" font-size="10" fill="#8b949e">step 1/5</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1504;0.1606;0.2988;0.3089;1" dur="24.6s" repeatCount="indefinite"/><text x="400.0" y="210" font-size="13" fill="#e6edf3" text-anchor="middle">r1's eth2 MTU is 1200 and DF forbids fragmentation, so r1 drops it and returns ICMP frag-needed.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1504;0.1606;0.2988;0.3089;1" dur="24.6s" repeatCount="indefinite"/><text x="24" y="238" font-size="10" fill="#8b949e">step 2/5</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3089;0.3191;0.5467;0.5569;1" dur="24.6s" repeatCount="indefinite"/><text x="400.0" y="210" font-size="13" fill="#e6edf3" text-anchor="middle">Contrast: without DF, r1 splits the same datagram into two fragments that h2 reassembles.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3089;0.3191;0.5467;0.5569;1" dur="24.6s" repeatCount="indefinite"/><text x="24" y="238" font-size="10" fill="#8b949e">step 3/5</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5569;0.5671;0.75;0.7602;1" dur="24.6s" repeatCount="indefinite"/><text x="400.0" y="210" font-size="13" fill="#e6edf3" text-anchor="middle">PMTUD: h1 caches path MTU 1200 and retries smaller — -s 1100 gives 1128 bytes, which fits.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5569;0.5671;0.75;0.7602;1" dur="24.6s" repeatCount="indefinite"/><text x="24" y="238" font-size="10" fill="#8b949e">step 4/5</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.7602;0.7703;0.9898;1" dur="24.6s" repeatCount="indefinite"/><text x="400.0" y="210" font-size="13" fill="#e6edf3" text-anchor="middle">The echo reply comes back; tracepath reports the same 1200-byte path MTU hop by hop.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.7602;0.7703;0.9898;1" dur="24.6s" repeatCount="indefinite"/><text x="24" y="238" font-size="10" fill="#8b949e">step 5/5</text></g>
