name: pp22

topology:
  nodes:
    h1:
      kind: linux
      image: "${LINUX_IMAGE:=ghcr.io/srl-labs/network-multitool:latest}"
      exec: ["ip addr add 10.0.1.2/24 dev eth1", "ip route add 10.0.2.0/24 via 10.0.1.1"]
    r1:
      kind: linux
      image: "${LINUX_IMAGE:=ghcr.io/srl-labs/network-multitool:latest}"
      sysctls: {net.ipv4.ip_forward: 1}
      exec:
        - ip addr add 10.0.1.1/24 dev eth1
        - ip addr add 10.0.2.1/24 dev eth2
        - ip link set eth2 mtu 1200
    h2:
      kind: linux
      image: "${LINUX_IMAGE:=ghcr.io/srl-labs/network-multitool:latest}"
      exec: ["ip addr add 10.0.2.2/24 dev eth1", "ip route add 10.0.1.0/24 via 10.0.2.1", "ip link set eth1 mtu 1200"]
  links:
    - endpoints: ["h1:eth1", "r1:eth1"]
    - endpoints: ["r1:eth2", "h2:eth1"]
