<text x="24" y="30" font-size="12.5" font-weight="600" fill="#8b949e">37 · FIFO vs fq_codel under HTB shaping</text>
<text x="776" y="30" font-size="11" fill="#8b949e" text-anchor="end">&#8635; 20.9s loop</text>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.012;0.2368;0.2488;1" dur="20.9s" repeatCount="indefinite"/><text x="400.0" y="217" font-size="13" fill="#e6edf3" text-anchor="middle">HTB on r1 eth2 shapes class 1:10 to 10 Mbit/s; an iperf3 bulk flow fills the bottleneck.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.012;0.2368;0.2488;1" dur="20.9s" repeatCount="indefinite"/><text x="24" y="245" font-size="10" fill="#8b949e">step 1/4</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2488;0.2608;0.5335;0.5455;1" dur="20.9s" repeatCount="indefinite"/><text x="400.0" y="217" font-size="13" fill="#e6edf3" text-anchor="middle">Child qdisc pfifo limit 1000: the ping waits behind bulk backlog on eth2 egress — loaded latency</text><text x="400.0" y="234" font-size="13" fill="#e6edf3" text-anchor="middle">balloons.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2488;0.2608;0.5335;0.5455;1" dur="20.9s" repeatCount="indefinite"/><text x="24" y="245" font-size="10" fill="#8b949e">step 2/4</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5455;0.5574;0.677;0.689;1" dur="20.9s" repeatCount="indefinite"/><text x="400.0" y="217" font-size="13" fill="#e6edf3" text-anchor="middle">Only the child queue changes: delete pfifo under 1:10 and add fq_codel — the HTB class stays 10 Mbit/s.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5455;0.5574;0.677;0.689;1" dur="20.9s" repeatCount="indefinite"/><text x="24" y="245" font-size="10" fill="#8b949e">step 3/4</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.689;0.701;0.988;1" dur="20.9s" repeatCount="indefinite"/><text x="400.0" y="217" font-size="13" fill="#e6edf3" text-anchor="middle">fq_codel keeps the ping flow separate from bulk: low latency under the same load. Fair queueing is not a</text><text x="400.0" y="234" font-size="13" fill="#e6edf3" text-anchor="middle">rate limiter.</text></g>
