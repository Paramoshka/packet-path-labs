name: pp37
topology:
  defaults:
    kind: linux
    image: ${LAB_IMAGE:=alpine:3.22}
    cmd: sleep infinity
  nodes:
    h1:
      exec:
      - apk add --no-cache iproute2 iputils tcpdump iperf3
      - ip addr add 10.37.1.2/24 dev eth1
      - ip route add 10.37.2.0/24 via 10.37.1.1
    r1:
      exec:
      - apk add --no-cache iproute2 iproute2-tc iputils tcpdump
      - ip addr add 10.37.1.1/24 dev eth1
      - ip addr add 10.37.2.1/24 dev eth2
      sysctls:
        net.ipv4.ip_forward: 1
    h2:
      exec:
      - apk add --no-cache iproute2 iputils tcpdump iperf3
      - ip addr add 10.37.2.2/24 dev eth1
      - ip route add 10.37.1.0/24 via 10.37.2.1
      - iperf3 -s -D
  links:
  - endpoints:
    - h1:eth1
    - r1:eth1
  - endpoints:
    - r1:eth2
    - h2:eth1
