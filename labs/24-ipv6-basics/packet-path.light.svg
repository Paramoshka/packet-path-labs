<text x="24" y="30" font-size="12.5" font-weight="600" fill="#57606a">24 · SLAAC router discovery, then NDP</text>
<text x="776" y="30" font-size="11" fill="#57606a" text-anchor="end">&#8635; 22.8s loop</text>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.011;0.1425;0.1535;1" dur="22.8s" repeatCount="indefinite"/><text x="400.0" y="210" font-size="13" fill="#1f2328" text-anchor="middle">With dnsmasq RA enabled on h1, h2 solicits routers with an RS to the all-routers group ff02::2.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.011;0.1425;0.1535;1" dur="22.8s" repeatCount="indefinite"/><text x="24" y="238" font-size="10" fill="#57606a">step 1/5</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1535;0.1645;0.3048;0.3158;1" dur="22.8s" repeatCount="indefinite"/><text x="400.0" y="210" font-size="13" fill="#1f2328" text-anchor="middle">h1 answers with an RA: prefix 2001:db8:24::/64 for SLAAC, plus a default route via its link-local.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1535;0.1645;0.3048;0.3158;1" dur="22.8s" repeatCount="indefinite"/><text x="24" y="238" font-size="10" fill="#57606a">step 2/5</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3158;0.3268;0.4583;0.4693;1" dur="22.8s" repeatCount="indefinite"/><text x="400.0" y="210" font-size="13" fill="#1f2328" text-anchor="middle">h2 runs DAD on its tentative SLAAC address; no NA answers the NS, so the address is unique.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3158;0.3268;0.4583;0.4693;1" dur="22.8s" repeatCount="indefinite"/><text x="24" y="238" font-size="10" fill="#57606a">step 3/5</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4693;0.4803;0.6952;0.7061;1" dur="22.8s" repeatCount="indefinite"/><text x="400.0" y="210" font-size="13" fill="#1f2328" text-anchor="middle">Before pinging, h1 resolves 2001:db8:1::2 with NS/NA — NDP replaces ARP using ICMPv6.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4693;0.4803;0.6952;0.7061;1" dur="22.8s" repeatCount="indefinite"/><text x="24" y="238" font-size="10" fill="#57606a">step 4/5</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.7061;0.7171;0.989;1" dur="22.8s" repeatCount="indefinite"/><text x="400.0" y="210" font-size="13" fill="#1f2328" text-anchor="middle">ICMPv6 echo flows over the NDP-learned MAC; the static 2001:db8:1::/64 baseline still works.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.7061;0.7171;0.989;1" dur="22.8s" repeatCount="indefinite"/><text x="24" y="238" font-size="10" fill="#57606a">step 5/5</text></g>
