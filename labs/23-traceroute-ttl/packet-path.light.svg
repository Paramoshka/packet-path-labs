<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1991;0.21;0.5087;0.5195;1" dur="23.1s" repeatCount="indefinite"/><text x="400.0" y="188" font-size="13" fill="#1f2328" text-anchor="middle">ping -t 2: r1 forwards with TTL 1; r2 decrements to 0 and sends time-exceeded — hop 2.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1991;0.21;0.5087;0.5195;1" dur="23.1s" repeatCount="indefinite"/><text x="24" y="216" font-size="10" fill="#57606a">step 2/3</text></g>
