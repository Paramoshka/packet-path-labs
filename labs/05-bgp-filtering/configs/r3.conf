frr defaults traditional
hostname r3
log stdout
!
route-map ALLOW-ALL permit 10
!
router bgp 65003
 bgp router-id 3.3.3.3
 neighbor 10.0.23.1 remote-as 65002
 address-family ipv4 unicast
  network 3.3.3.3/32
  network 33.33.33.33/32
  neighbor 10.0.23.1 activate
  neighbor 10.0.23.1 route-map ALLOW-ALL in
  neighbor 10.0.23.1 route-map ALLOW-ALL out
 exit-address-family
!
