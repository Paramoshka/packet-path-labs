frr defaults traditional
hostname r2
log stdout
service integrated-vtysh-config
!
ip prefix-list TO-R1 seq 5 permit 3.3.3.3/32
!
route-map FILTER-TO-R1 permit 10
 match ip address prefix-list TO-R1
!
router bgp 65002
 bgp router-id 2.2.2.2
 neighbor 10.0.12.1 remote-as 65001
 neighbor 10.0.23.2 remote-as 65003
 address-family ipv4 unicast
  network 2.2.2.2/32
  neighbor 10.0.12.1 activate
  neighbor 10.0.12.1 route-map FILTER-TO-R1 out
  neighbor 10.0.23.2 activate
 exit-address-family
!
