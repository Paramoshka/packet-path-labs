<text x="776" y="30" font-size="11" fill="#8b949e" text-anchor="end">&#8635; 23.3s loop</text>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0107;0.1481;0.1588;1" dur="23.3s" repeatCount="indefinite"/><text x="400.0" y="195" font-size="13" fill="#e6edf3" text-anchor="middle">With no address, the client broadcasts DHCPDISCOVER (0.0.0.0 → 255.255.255.255, UDP 68→67).</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0107;0.1481;0.1588;1" dur="23.3s" repeatCount="indefinite"/><text x="24" y="223" font-size="10" fill="#8b949e">step 1/5</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1588;0.1695;0.3069;0.3176;1" dur="23.3s" repeatCount="indefinite"/><text x="400.0" y="195" font-size="13" fill="#e6edf3" text-anchor="middle">Routers do not forward broadcasts; dnsmasq relays it unicast to 10.33.1.2 with giaddr=10.33.0.1.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1588;0.1695;0.3069;0.3176;1" dur="23.3s" repeatCount="indefinite"/><text x="24" y="223" font-size="10" fill="#8b949e">step 2/5</text></g>
