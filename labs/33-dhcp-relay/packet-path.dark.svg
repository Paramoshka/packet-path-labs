<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3176;0.3283;0.5215;0.5322;1" dur="23.3s" repeatCount="indefinite"/><text x="24" y="223" font-size="10" fill="#8b949e">step 3/5</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5322;0.5429;0.7361;0.7468;1" dur="23.3s" repeatCount="indefinite"/><text x="400.0" y="195" font-size="13" fill="#e6edf3" text-anchor="middle">The client broadcasts DHCPREQUEST for the offered address; the relay forwards it with giaddr again.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5322;0.5429;0.7361;0.7468;1" dur="23.3s" repeatCount="indefinite"/><text x="24" y="223" font-size="10" fill="#8b949e">step 4/5</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.7468;0.7575;0.9893;1" dur="23.3s" repeatCount="indefinite"/><text x="400.0" y="195" font-size="13" fill="#e6edf3" text-anchor="middle">DHCPACK completes DORA; the hook installs the address, default route via 10.33.0.1 and DNS 10.33.1.2.</text></g>
