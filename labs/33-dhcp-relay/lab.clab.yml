name: pp33
topology:
  defaults:
    kind: linux
    image: ${LAB_IMAGE:=alpine:3.22}
    cmd: sleep infinity
  nodes:
    client:
      exec:
      - apk add --no-cache iproute2 iputils tcpdump bind-tools
      binds:
      - configs/udhcpc.sh:/etc/lab/udhcpc.sh:ro
    relay:
      exec:
      - apk add --no-cache iproute2 iputils tcpdump dnsmasq
      - ip addr add 10.33.0.1/24 dev eth1
      - ip addr add 10.33.1.1/24 dev eth2
      - dnsmasq --conf-file=/etc/dnsmasq.conf
      sysctls:
        net.ipv4.ip_forward: 1
      binds:
      - configs/relay.conf:/etc/dnsmasq.conf:ro
    server:
      exec:
      - apk add --no-cache iproute2 iputils tcpdump dnsmasq
      - ip addr add 10.33.1.2/24 dev eth1
      - ip route add 10.33.0.0/24 via 10.33.1.1
      - dnsmasq --conf-file=/etc/dnsmasq.conf
      binds:
      - configs/server.conf:/etc/dnsmasq.conf:ro
  links:
  - endpoints:
    - client:eth1
    - relay:eth1
  - endpoints:
    - relay:eth2
    - server:eth1
