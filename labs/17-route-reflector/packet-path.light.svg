<text x="24" y="30" font-size="12.5" font-weight="600" fill="#57606a">17 · Route reflector replaces the iBGP mesh</text>
<text x="776" y="30" font-size="11" fill="#57606a" text-anchor="end">&#8635; 16.5s loop</text>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0152;0.1909;0.2061;1" dur="16.5s" repeatCount="indefinite"/><text x="400.0" y="367" font-size="13" fill="#1f2328" text-anchor="middle">One AS 65000, no full mesh — r1, r2 and r3 each keep a single iBGP session, to the route reflector.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0152;0.1909;0.2061;1" dur="16.5s" repeatCount="indefinite"/><text x="24" y="395" font-size="10" fill="#57606a">step 1/4</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2061;0.2212;0.4152;0.4303;1" dur="16.5s" repeatCount="indefinite"/><text x="400.0" y="367" font-size="13" fill="#1f2328" text-anchor="middle">r1 originates its loopback 1.1.1.1/32 and sends an iBGP UPDATE to the RR.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2061;0.2212;0.4152;0.4303;1" dur="16.5s" repeatCount="indefinite"/><text x="24" y="395" font-size="10" fill="#57606a">step 2/4</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4303;0.4455;0.7;0.7152;1" dur="16.5s" repeatCount="indefinite"/><text x="400.0" y="367" font-size="13" fill="#1f2328" text-anchor="middle">The RR reflects the UPDATE to clients r2 and r3, adding ORIGINATOR_ID and CLUSTER_LIST for loop</text><text x="400.0" y="384" font-size="13" fill="#1f2328" text-anchor="middle">prevention.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4303;0.4455;0.7;0.7152;1" dur="16.5s" repeatCount="indefinite"/><text x="24" y="395" font-size="10" fill="#57606a">step 3/4</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.7152;0.7303;0.9848;1" dur="16.5s" repeatCount="indefinite"/><text x="400.0" y="367" font-size="13" fill="#1f2328" text-anchor="middle">r2 and r3 now hold 1.1.1.1/32 in BGP without any direct session to r1; the route is never reflected back</text><text x="400.0" y="384" font-size="13" fill="#1f2328" text-anchor="middle">to its originator.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.7152;0.7303;0.9848;1" dur="16.5s" repeatCount="indefinite"/><text x="24" y="395" font-size="10" fill="#57606a">step 4/4</text></g>
