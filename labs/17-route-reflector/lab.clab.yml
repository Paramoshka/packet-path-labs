name: pp17

topology:
  defaults: {kind: linux, image: "${FRR_IMAGE:=quay.io/frrouting/frr:10.7.1}"}
  nodes:
    rr:
      binds: ["configs/daemons:/etc/frr/daemons:ro", "configs/rr.conf:/etc/frr/frr.conf:ro"]
      exec: ["ip addr add 10.0.1.1/30 dev eth1", "ip addr add 10.0.2.1/30 dev eth2", "ip addr add 10.0.3.1/30 dev eth3"]
    r1:
      binds: ["configs/daemons:/etc/frr/daemons:ro", "configs/r1.conf:/etc/frr/frr.conf:ro"]
      exec: ["ip addr add 10.0.1.2/30 dev eth1", "ip addr add 1.1.1.1/32 dev lo"]
    r2:
      binds: ["configs/daemons:/etc/frr/daemons:ro", "configs/r2.conf:/etc/frr/frr.conf:ro"]
      exec: ["ip addr add 10.0.2.2/30 dev eth1", "ip addr add 2.2.2.2/32 dev lo"]
    r3:
      binds: ["configs/daemons:/etc/frr/daemons:ro", "configs/r3.conf:/etc/frr/frr.conf:ro"]
      exec: ["ip addr add 10.0.3.2/30 dev eth1", "ip addr add 3.3.3.3/32 dev lo"]
  links:
    - endpoints: ["rr:eth1", "r1:eth1"]
    - endpoints: ["rr:eth2", "r2:eth1"]
    - endpoints: ["rr:eth3", "r3:eth1"]
