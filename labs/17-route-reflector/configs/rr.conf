frr defaults traditional
hostname rr
log stdout
service integrated-vtysh-config
!
router bgp 65000
 bgp router-id 10.0.0.254
 neighbor 10.0.1.2 remote-as 65000
 neighbor 10.0.2.2 remote-as 65000
 neighbor 10.0.3.2 remote-as 65000
 address-family ipv4 unicast
  neighbor 10.0.1.2 activate
  neighbor 10.0.1.2 route-reflector-client
  neighbor 10.0.2.2 activate
  neighbor 10.0.2.2 route-reflector-client
  neighbor 10.0.3.2 activate
  neighbor 10.0.3.2 route-reflector-client
 exit-address-family
!
