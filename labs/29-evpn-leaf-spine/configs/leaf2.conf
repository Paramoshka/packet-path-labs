frr defaults traditional
hostname leaf2
log stdout
service integrated-vtysh-config
!
router bgp 65102
 bgp router-id 10.255.0.2
 neighbor 10.0.12.1 remote-as 65000
 neighbor 10.0.22.1 remote-as 65000
 neighbor 10.255.0.1 remote-as 65101
 neighbor 10.255.0.1 update-source 10.255.0.2
 neighbor 10.255.0.1 ebgp-multihop 5
 address-family ipv4 unicast
  network 10.255.0.2/32
  neighbor 10.0.12.1 activate
  neighbor 10.0.22.1 activate
 exit-address-family
 address-family l2vpn evpn
  neighbor 10.255.0.1 activate
  advertise-all-vni
 exit-address-family
!
