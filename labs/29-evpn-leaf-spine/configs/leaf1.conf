frr defaults traditional
hostname leaf1
log stdout
service integrated-vtysh-config
!
router bgp 65101
 bgp router-id 10.255.0.1
 neighbor 10.0.11.1 remote-as 65000
 neighbor 10.0.21.1 remote-as 65000
 neighbor 10.255.0.2 remote-as 65102
 neighbor 10.255.0.2 update-source 10.255.0.1
 neighbor 10.255.0.2 ebgp-multihop 5
 address-family ipv4 unicast
  network 10.255.0.1/32
  neighbor 10.0.11.1 activate
  neighbor 10.0.21.1 activate
 exit-address-family
 address-family l2vpn evpn
  neighbor 10.255.0.2 activate
  advertise-all-vni
 exit-address-family
!
