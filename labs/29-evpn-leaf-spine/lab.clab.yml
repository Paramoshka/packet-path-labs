name: pp29

topology:
  nodes:
    spine1:
      kind: linux
      image: "${FRR_IMAGE:=quay.io/frrouting/frr:10.7.1}"
      binds: ["configs/daemons:/etc/frr/daemons:ro", "configs/spine1.conf:/etc/frr/frr.conf:ro"]
      exec: ["ip addr add 10.0.11.1/30 dev eth1", "ip addr add 10.0.12.1/30 dev eth2", "ip addr add 10.255.255.1/32 dev lo"]
    spine2:
      kind: linux
      image: "${FRR_IMAGE:=quay.io/frrouting/frr:10.7.1}"
      binds: ["configs/daemons:/etc/frr/daemons:ro", "configs/spine2.conf:/etc/frr/frr.conf:ro"]
      exec: ["ip addr add 10.0.21.1/30 dev eth1", "ip addr add 10.0.22.1/30 dev eth2", "ip addr add 10.255.255.2/32 dev lo"]
    leaf1:
      kind: linux
      image: "${FRR_IMAGE:=quay.io/frrouting/frr:10.7.1}"
      binds: ["configs/daemons:/etc/frr/daemons:ro", "configs/leaf1.conf:/etc/frr/frr.conf:ro"]
      exec:
        - ip addr add 10.0.11.2/30 dev eth1
        - ip addr add 10.0.21.2/30 dev eth2
        - ip addr add 10.255.0.1/32 dev lo
        - ip link add br100 type bridge
        - ip link set br100 up
        - ip link set eth3 master br100
        - ip link add vxlan100 type vxlan id 100 local 10.255.0.1 dstport 4789 nolearning
        - ip link set vxlan100 master br100
        - ip link set vxlan100 up
    leaf2:
      kind: linux
      image: "${FRR_IMAGE:=quay.io/frrouting/frr:10.7.1}"
      binds: ["configs/daemons:/etc/frr/daemons:ro", "configs/leaf2.conf:/etc/frr/frr.conf:ro"]
      exec:
        - ip addr add 10.0.12.2/30 dev eth1
        - ip addr add 10.0.22.2/30 dev eth2
        - ip addr add 10.255.0.2/32 dev lo
        - ip link add br100 type bridge
        - ip link set br100 up
        - ip link set eth3 master br100
        - ip link add vxlan100 type vxlan id 100 local 10.255.0.2 dstport 4789 nolearning
        - ip link set vxlan100 master br100
        - ip link set vxlan100 up
    h1: {kind: linux, image: "${LINUX_IMAGE:=ghcr.io/srl-labs/network-multitool:latest}", exec: ["ip addr add 10.10.10.11/24 dev eth1"]}
    h2: {kind: linux, image: "${LINUX_IMAGE:=ghcr.io/srl-labs/network-multitool:latest}", exec: ["ip addr add 10.10.10.22/24 dev eth1"]}
  links:
    - endpoints: ["spine1:eth1", "leaf1:eth1"]
    - endpoints: ["spine1:eth2", "leaf2:eth1"]
    - endpoints: ["spine2:eth1", "leaf1:eth2"]
    - endpoints: ["spine2:eth2", "leaf2:eth2"]
    - endpoints: ["leaf1:eth3", "h1:eth1"]
    - endpoints: ["leaf2:eth3", "h2:eth1"]
