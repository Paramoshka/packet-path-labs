<text x="24" y="30" font-size="12.5" font-weight="600" fill="#8b949e">04 · eBGP sessions and AS_PATH propagation</text>
<text x="776" y="30" font-size="11" fill="#8b949e" text-anchor="end">&#8635; 20.6s loop</text>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0121;0.1772;0.1893;1" dur="20.6s" repeatCount="indefinite"/><text x="400.0" y="188" font-size="13" fill="#e6edf3" text-anchor="middle">eBGP sessions ride TCP/179 between neighboring ASes; OPEN and KEEPALIVE bring them up.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0121;0.1772;0.1893;1" dur="20.6s" repeatCount="indefinite"/><text x="24" y="216" font-size="10" fill="#8b949e">step 1/4</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1893;0.2015;0.4393;0.4515;1" dur="20.6s" repeatCount="indefinite"/><text x="400.0" y="188" font-size="13" fill="#e6edf3" text-anchor="middle">r1 originates 1.1.1.1/32; r2 prepends its own AS before re-advertising to r3.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1893;0.2015;0.4393;0.4515;1" dur="20.6s" repeatCount="indefinite"/><text x="24" y="216" font-size="10" fill="#8b949e">step 2/4</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4515;0.4636;0.7015;0.7136;1" dur="20.6s" repeatCount="indefinite"/><text x="400.0" y="188" font-size="13" fill="#e6edf3" text-anchor="middle">The reverse direction works the same way; r3's loopback reaches r1 across two AS hops.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4515;0.4636;0.7015;0.7136;1" dur="20.6s" repeatCount="indefinite"/><text x="24" y="216" font-size="10" fill="#8b949e">step 3/4</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.7136;0.7257;0.9879;1" dur="20.6s" repeatCount="indefinite"/><text x="400.0" y="188" font-size="13" fill="#e6edf3" text-anchor="middle">Data follows the BGP routes; r1 pings 3.3.3.3 through AS 65002 and AS 65003.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.7136;0.7257;0.9879;1" dur="20.6s" repeatCount="indefinite"/><text x="24" y="216" font-size="10" fill="#8b949e">step 4/4</text></g>
