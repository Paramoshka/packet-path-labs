<text x="24" y="30" font-size="12.5" font-weight="600" fill="#8b949e">12 · Router-on-a-stick: 802.1Q inter-VLAN routing</text>
<text x="776" y="30" font-size="11" fill="#8b949e" text-anchor="end">&#8635; 21.3s loop</text>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0117;0.1432;0.1549;1" dur="21.3s" repeatCount="indefinite"/><text x="400.0" y="345" font-size="13" fill="#e6edf3" text-anchor="middle">h10 wants 10.20.20.20 in VLAN 20, so it sends the frame to its gateway 10.10.10.1 on r1.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0117;0.1432;0.1549;1" dur="21.3s" repeatCount="indefinite"/><text x="24" y="373" font-size="10" fill="#8b949e">step 1/5</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1549;0.1667;0.3075;0.3192;1" dur="21.3s" repeatCount="indefinite"/><text x="400.0" y="345" font-size="13" fill="#e6edf3" text-anchor="middle">sw1 tags the frame with VLAN 10 and forwards it over the 802.1Q trunk; r1 receives it on eth1.10.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1549;0.1667;0.3075;0.3192;1" dur="21.3s" repeatCount="indefinite"/><text x="24" y="373" font-size="10" fill="#8b949e">step 2/5</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3192;0.331;0.4718;0.4836;1" dur="21.3s" repeatCount="indefinite"/><text x="400.0" y="345" font-size="13" fill="#e6edf3" text-anchor="middle">r1 routes between sub-interfaces: out eth1.20 the frame is re-tagged as VLAN 20 back onto the trunk.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3192;0.331;0.4718;0.4836;1" dur="21.3s" repeatCount="indefinite"/><text x="24" y="373" font-size="10" fill="#8b949e">step 3/5</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4836;0.4953;0.6268;0.6385;1" dur="21.3s" repeatCount="indefinite"/><text x="400.0" y="345" font-size="13" fill="#e6edf3" text-anchor="middle">sw1 strips the tag on the access port; h20 receives plain Ethernet and aims its reply at 10.20.20.1.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4836;0.4953;0.6268;0.6385;1" dur="21.3s" repeatCount="indefinite"/><text x="24" y="373" font-size="10" fill="#8b949e">step 4/5</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.6385;0.6502;0.9883;1" dur="21.3s" repeatCount="indefinite"/><text x="400.0" y="345" font-size="13" fill="#e6edf3" text-anchor="middle">The reply rides VLAN 20 to r1, is routed to eth1.10, and reaches h10 untagged — one trunk, two VLANs.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.6385;0.6502;0.9883;1" dur="21.3s" repeatCount="indefinite"/><text x="24" y="373" font-size="10" fill="#8b949e">step 5/5</text></g>
<rect x="0" y="381" width="0" height="3" rx="1.5" fill="#58a6ff" opacity="0.4"><animate attributeName="width" values="0;800" keyTimes="0;1" dur="21.3s" repeatCount="indefinite"/></rect>
</svg>
